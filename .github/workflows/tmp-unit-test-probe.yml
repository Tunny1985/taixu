name: TMP Unit Test Probe

# 临时探针：仓库现有工作流只做 assemble，从不执行单元测试。
# 置于 Fork 的默认分支以便 workflow_dispatch 可用；验证后即删除，不进入 PR。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to test'
        required: false
        default: 'feature/custom-iteration-bootstrap-hardening'

jobs:
  unit-test:
    name: testDebugUnitTest (custom_iteration)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Unit Tests for feature:custom_iteration
        run: ./gradlew :feature:custom_iteration:testDebugUnitTest --no-daemon --stacktrace
